name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Funciona con la carpeta android/ suelta O con el .zip subido tal cual al repo
      - name: Preparar código (descomprime el .zip si hace falta)
        run: |
          if [ -d android ]; then
            echo "APP_DIR=android" >> "$GITHUB_ENV"
          else
            zipfile=$(ls ./*.zip 2>/dev/null | head -n1)
            if [ -z "$zipfile" ]; then
              echo "No encontré la carpeta android/ ni ningún .zip en la raíz del repo"
              exit 1
            fi
            mkdir -p src
            unzip -q -o "$zipfile" -d src
            settings=$(find src -name settings.gradle.kts | head -n1)
            if [ -z "$settings" ]; then
              echo "El zip no contiene el proyecto Android"
              exit 1
            fi
            echo "APP_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Firma fija (recomendado): secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD
      - name: Configurar firma fija (si hay secretos)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            # Limpia espacios y saltos de línea que se cuelan al pegar el secreto
            printf '%s' "$KS" | tr -d ' \n\r' | base64 -d > "$APP_DIR/app/wavko.keystore"
            # La contraseña solo lleva letras y números: se quita el prefijo "KEYSTORE_PASSWORD=" y todo lo demás
            pw=$(printf '%s' "$KSP" | sed 's/KEYSTORE_PASSWORD=//' | tr -cd 'A-Za-z0-9')
            echo "KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "Firma fija activada (contraseña de ${#pw} caracteres)"
          else
            echo "Sin KEYSTORE_BASE64: firma temporal (cambia en cada build)"
          fi

      # Opcional: notificaciones push. Pega el contenido de google-services.json en el secret GOOGLE_SERVICES_JSON
      - name: Configurar Firebase (si hay secret)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > "$APP_DIR/app/google-services.json"
            echo "Firebase activado"
          else
            echo "Sin GOOGLE_SERVICES_JSON: compilo sin push"
          fi

      # Opcional: la variable WAVKO_SERVER y el secret ACCESS_KEY (si existen) quedan
      # como valores por defecto de la app. Sin ellas se usa wss://voxgo.pedroxhile.workers.dev
      - name: Build debug APK
        env:
          WAVKO_SERVER: ${{ vars.WAVKO_SERVER || vars.VOXGO_SERVER }}
          WAVKO_KEY: ${{ secrets.ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          KEY_ALIAS: wavko
        run: |
          cd "$APP_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$APP_DIR/app/build/outputs/apk/debug/app-debug.apk" wavko.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavko-apk
          path: wavko.apk

      # Cada build en main/master publica un Release "v<versionCode>" con el APK:
      # de ahí lo descarga el botón "Verificar actualizaciones" de la app (repositorio público).
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$APP_DIR/app/build.gradle.kts" | head -n1)
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$APP_DIR/app/build.gradle.kts" | head -n1)
          tag="v$code"
          gh release delete "$tag" --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$tag" wavko.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Wavko $name" --notes "Wavko $name (build $code)" --latest
